# Set to 1 after the matching IMX586 IQ files and camera hardware are installed.
PCL_CAMERA_AUTOSTART=0
PCL_CAMERA_COUNT=1
PCL_CAMERA_IQ0=/etc/iqfiles
PCL_CAMERA_IQ1=/etc/iqfiles
PCL_CAMERA_VIDEO0=auto
PCL_CAMERA_VIDEO1=auto
PCL_CAMERA_PARAMS0=auto
PCL_CAMERA_PARAMS1=auto
PCL_CAMERA_SUBDEV0=auto
PCL_CAMERA_SUBDEV1=auto
PCL_CAMERA_XDAS_UART=/dev/ttyS2
PCL_CAMERA_SAVE_ROOT=/userdata/camera
PCL_CAMERA_VERSION=DASCAM-RV1126B-00.01
